# Local-only. Deployment is handled entirely by Terraform (see README).
#
#   docker compose up site            production image, http://localhost:8080
#   docker compose --profile dev up   hot-reload dev server, http://localhost:5173
#
# Note: these build for your native architecture, which is the point — it's
# faster locally. Terraform builds linux/amd64 for Fargate.

services:
  # Byte-for-byte the image that gets deployed, including the nginx config,
  # SPA fallback, cache headers, and /healthz.
  site:
    build:
      context: .
      target: serve
    image: mvecc-home:local
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # Vite dev server with hot reload against your working tree.
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the image's node_modules; the bind mount above would hide them.
      - /app/node_modules
    environment:
      # Needed for file watching to work through a bind mount on macOS.
      CHOKIDAR_USEPOLLING: "true"
    profiles:
      - dev
